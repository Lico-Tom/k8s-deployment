# 生产环境：多副本 + HPA + PDB + 网络策略 + 监控
# 用法：helm upgrade --install api . -f environments/values-prod.yaml -n prod
#       ——secret.create=false，密钥走集群内已有的外部 Secret

replicaCount: 3

image:
  repository: openapi-generator-python
  # 生产必须钉死具体版本，不要用 latest，也不要留空回落到 AppVersion
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# 私有仓库凭证（需提前在 prod 命名空间创建）
imagePullSecrets:
  - name: regcred

configMap:
  create: true
  data:
    APP_ENV: production
    LOG_LEVEL: WARNING
    PYTHONPATH: /app/src
    UVICORN_HOST: 0.0.0.0
    UVICORN_PORT: "8080"
    UVICORN_WORKERS: "4"

# 生产不把密钥写进 chart：引用外部 Secret（如 External Secrets / Vault 同步出来的）
secret:
  create: false
  existingName: openapi-generator-python-secret

priorityClassName: system-cluster-critical

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

startupProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.example.com
      paths:
        - path: /api/v1(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    - secretName: openapi-generator-python-tls
      hosts:
        - api.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
  interval: 15s
  labels:
    release: prometheus

networkPolicy:
  enabled: true

migrationJob:
  enabled: true
  backoffLimit: 5
  activeDeadlineSeconds: 900
  args:
    - --init

# 跨可用区打散，避免单 AZ 故障导致全挂
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: openapi-generator-python
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: openapi-generator-python
